            var latlng = [lat, lng];

                userMarker = L.marker(latlng, {
                    title: "Ubicación actual del digitalizador"
                }).addTo(map_402293fe532ac56ff90ec700d0f060ec);

                userMarker.bindPopup("📍 Ubicación actual del digitalizador");
            } else {
                userMarker.setLatLng(latlng);
            }

            if (!userCircle) {
                userCircle = L.circle(latlng, {
                    radius: accuracy || 30,
                    color: "#ee1c25",
                    fillColor: "#ee1c25",
                    fillOpacity: 0.18,
                    weight: 2
                }).addTo(map_402293fe532ac56ff90ec700d0f060ec);
            } else {
                userCircle.setLatLng(latlng);
                userCircle.setRadius(accuracy || 30);
            }

            if (firstCenter) {
                map_402293fe532ac56ff90ec700d0f060ec.setView(latlng, 15);
                firstCenter = false;
            }
        }

        window.addEventListener("message", function(event) {

                event.data.lat,
                event.data.lon,
                event.data.accuracy
            );
        });
    })();
