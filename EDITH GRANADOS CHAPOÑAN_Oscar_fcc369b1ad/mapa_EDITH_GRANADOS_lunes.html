                userCircle = L.circle(latlng, {

                    color: "#ee1c25",

                    fillOpacity: 0.18,
                    weight: 2

            } else {
                userCircle.setLatLng(latlng);

            }

            if (firstCenter) {
                map_2762a1bb65bbf862194da68add2cfcc5.setView(latlng, 15);

            }

                event.data.lon,
                event.data.accuracy

        });
    })();
