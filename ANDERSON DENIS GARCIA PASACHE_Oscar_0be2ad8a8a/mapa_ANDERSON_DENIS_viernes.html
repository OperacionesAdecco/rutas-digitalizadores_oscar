        var userMarker = null;

            var latlng = [lat, lng];

                userMarker = L.marker(latlng, {
                    title: "Ubicación actual del digitalizador"
                }).addTo(map_a2c1acd254187e941765771a3445743b);

            } else {
                userMarker.setLatLng(latlng);
            }

            if (!userCircle) {
                userCircle = L.circle(latlng, {
                    radius: accuracy || 30,
                    color: "#ee1c25",
                    fillColor: "#ee1c25",
                    fillOpacity: 0.18,
                    weight: 2
                }).addTo(map_a2c1acd254187e941765771a3445743b);
            } else {
                userCircle.setLatLng(latlng);
                userCircle.setRadius(accuracy || 30);
            }

            if (firstCenter) {
                map_a2c1acd254187e941765771a3445743b.setView(latlng, 15);
                firstCenter = false;
            }
        }

        window.addEventListener("message", function(event) {

                event.data.lon,
                event.data.accuracy

    })();
